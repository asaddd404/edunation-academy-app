[pytest]
testpaths = tests
# The parser tests import `app.*` directly; rootdir on sys.path makes that
# work without installing the backend as a package.
pythonpath = .
# DB-backed tests (test_ent_teacher_bulk_delete.py and friends) are plain
# `async def` tests, not @pytest.mark.asyncio-decorated -- auto mode picks
# them up without every test file needing the marker.
asyncio_mode = auto
# The `test_engine` fixture in conftest.py is session-scoped (one Postgres
# engine for the whole run) -- asyncpg connections aren't portable across
# event loops, so fixtures *and* tests need to share one loop for the whole
# session, not the per-function loop pytest-asyncio defaults to.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
