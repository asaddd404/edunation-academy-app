# Production stack. Run with:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Differences from the development compose that matter:
#   * no source bind-mounts and no --reload -- the image is the artifact;
#   * postgres/redis are not published to the host, so they are reachable only
#     from inside the compose network (on a public VPS, exposing 5432 is how
#     databases get found and brute-forced);
#   * uploads live in a named volume instead of the source tree, so a rebuild
#     or a `git pull` cannot wipe lesson videos and images;
#   * the frontend is prebuilt static served by Caddy, which also handles TLS.

# Resource ceilings (deploy.resources, honoured by `docker compose up`).
# The VPS has 1 CPU and 2 GB of RAM. Without ceilings, whichever process grows
# first -- an ffmpeg transcode, a leaking worker -- makes the kernel's OOM
# killer choose a victim for the whole box, and its usual choice is Postgres.
# With them, the over-budget container alone is killed and restarted
# (restart: unless-stopped), and the database keeps its memory. The sum
# (~1.8 GB) leaves the rest to the OS and page cache; swap absorbs spikes.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 640M
          pids: 200

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Authenticated even though it is only reachable inside the compose
    # network: without a password, compromising any one container (the PDF
    # parser and ffmpeg are the realistic candidates) hands the attacker
    # every session token in Redis with a one-line connect.
    # maxmemory is an availability control, not a tuning knob. Redis holds
    # sessions, rate-limit counters and cached aggregates, all of which grow
    # with traffic and none of which expire instantly. Without a ceiling it
    # grows until the kernel picks a process to kill, and on a 2 GB box the
    # OOM killer's usual choice is Postgres -- so a Redis leak becomes total
    # data-layer downtime. allkeys-lru sheds the coldest keys instead: the
    # cost is a re-login or a recomputed leaderboard, not an outage.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    security_opt:
      - no-new-privileges:true
    # Started directly as the image's redis user (uid 999, gid 1000), not as
    # root. As root the entrypoint first runs `find /data ... -exec chown`,
    # then drops privileges with setpriv -- and under `cap_drop: ALL` both
    # fail: setpriv without SETUID/SETGID (exit 127), and, once AOF has
    # created the 0700 `appendonlydir`, `find` without DAC_READ_SEARCH
    # ("Permission denied", exit 1). Granting capabilities back one restart
    # loop at a time is how the site went down twice; skipping the root
    # branch needs none at all. The volume's files are already owned by
    # 999:1000, so there is nothing for that chown to do anyway.
    user: "999:1000"
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          # maxmemory 256mb plus the AOF rewrite fork's copy-on-write headroom.
          memory: 320M
          pids: 64

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    # --forwarded-allow-ips: uvicorn only honours X-Forwarded-For/Proto from
    # these peers. Left at the default (127.0.0.1) it ignores Caddy's headers
    # entirely and every request looks like it came from the proxy -- which
    # would make the IP-keyed rate limits either useless or global.
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
      --proxy-headers --forwarded-allow-ips='*'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          # Two uvicorn workers (~110 MB each) plus one ffmpeg transcode at a
          # time (VIDEO_TRANSCODE_GATE). 0.9 CPU so a transcode or a burst
          # of requests can never starve Postgres and Caddy completely.
          cpus: "0.90"
          memory: 768M
          pids: 256

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Baked into the bundle at build time. Relative on purpose -- Caddy
        # serves the app and the API on one origin, so this needs no domain.
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Certificates survive container rebuilds; without this, every deploy
      # re-requests them and quickly hits Let's Encrypt rate limits.
      - caddydata:/data
      - caddyconfig:/config
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 160M
          pids: 128

volumes:
  pgdata:
  redisdata:
  uploads:
  caddydata:
  caddyconfig:
