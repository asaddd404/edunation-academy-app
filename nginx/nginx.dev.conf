server {
    listen 80;

    # Mirrors the production Caddyfile so a header problem shows up locally
    # rather than only after a deploy. HSTS is deliberately absent: this
    # server is plain http, and sending it would pin localhost to https in
    # the developer's browser for a year.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Lesson video uploads go up to MAX_VIDEO_FILE_SIZE (2 GB) in
        # app/core/video.py -- nginx's 1 MB default would reject them.
        client_max_body_size 2100M;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://frontend:5173/;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
    }
}
